<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metro Lines</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #fff;
            overflow: hidden;
        }

        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: linear-gradient(45deg, #1a1a2e, #16213e);
        }

        #network-canvas {
            width: 100%;
            height: 100%;
            cursor: grab;
            background: radial-gradient(circle at center, #16213e 0%, #0f0f23 100%);
        }

        #network-canvas:active {
            cursor: grabbing;
        }

        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .control-group {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: white;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .zoom-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
        }

        .line-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            font-size: 12px;
            max-width: 250px;
        }

        .segment-info {
            margin: 5px 0;
            padding: 5px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            font-size: 10px;
        }

        .station-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 200px;
            display: none;
        }

        .station-label {
            dominant-baseline: central;
            font-weight: 500;
            fill: #fff;
            font-size: 11px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        @media (max-width: 768px) {
            .line-info {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg id="network-canvas" viewBox="0 0 1000 800">
            <defs>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                    <feMerge> 
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
                    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
                </pattern>
            </defs>
            
            <!-- Background grid -->
            <rect width="100%" height="100%" fill="url(#grid)" />
            
            <!-- Main content group for zoom/pan -->
            <g id="main-group" transform="translate(0,0) scale(1)">
                <!-- Tram line will be added here -->
                <g id="tram-line"></g>
                <!-- Stations will be added here -->
                <g id="stations"></g>
                <!-- Station labels will be added here -->
                <g id="labels"></g>
            </g>
        </svg>

        <div class="line-info">
            <h3 style="margin-bottom: 10px; color: #4ecdc4;">Line Information</h3>
            <div>Total Segments: <span id="segment-count">0</span></div>
            <div>Total Stations: <span id="station-count">0</span></div>
            <div style="margin-top: 10px;">
                <strong>Segments:</strong>
                <div id="segment-list"></div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <button onclick="zoomIn()">Zoom In (+)</button>
                <button onclick="zoomOut()">Zoom Out (-)</button>
                <button onclick="resetView()">Reset View</button>
            </div>
            <div class="control-group">
                <button onclick="toggleLabels()">Toggle Labels</button>
                <button onclick="showSegmentColors()">Show Segment Colors</button>
                <button onclick="toggleStationDots()">Toggle Station Dots</button>
            </div>
        </div>

        <div class="zoom-info">
            Zoom: <span id="zoom-level">100%</span> | 
            Use mouse wheel to zoom, drag to pan
            <br>
            Current Time: <span id="current-time"></span>
        </div>

        <div class="station-info" id="station-info">
            <strong>Station Name</strong><br>
            <span>Segment: 1, Position: 2/3</span>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="configA.js"></script>
    <script src="lineConfig.js"></script>
    <script src="visual.js"></script>
    <script src="control.js"></script>
    <script src="animation.js"></script>
    <script src="animationA.js"></script>
</body>
</html>
