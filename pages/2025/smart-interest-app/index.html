<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Interest - Your Financial Dashboard</title>
    <style>
      :root {
        /* Dark Theme Color System */
        --primary-50: #1e293b;
        --primary-100: #334155;
        --primary-500: #06b6d4;
        --primary-600: #0891b2;
        --primary-700: #0e7490;
        
        --success-50: #064e3b;
        --success-100: #065f46;
        --success-500: #10b981;
        --success-600: #059669;
        
        --warning-50: #451a03;
        --warning-100: #78350f;
        --warning-500: #f59e0b;
        
        --error-50: #450a0a;
        --error-500: #ef4444;
        
        --accent-cyan: #22d3ee;
        --accent-purple: #a855f7;
        --accent-pink: #ec4899;
        --accent-green: #22c55e;
        
        /* Dark background colors */
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --bg-card: #1e293b;
        --bg-card-hover: #334155;
        
        /* Dark text colors */
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #64748b;
        --text-accent: #94a3b8;
        
        /* Border colors */
        --border-primary: #334155;
        --border-secondary: #475569;
        
        /* Typography */
        --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-size-xs: 0.75rem;
        --font-size-sm: 0.875rem;
        --font-size-base: 1rem;
        --font-size-lg: 1.125rem;
        --font-size-xl: 1.25rem;
        --font-size-2xl: 1.5rem;
        --font-size-3xl: 1.875rem;
        --font-size-4xl: 2.25rem;
        
        /* Spacing */
        --spacing-1: 0.25rem;
        --spacing-2: 0.5rem;
        --spacing-3: 0.75rem;
        --spacing-4: 1rem;
        --spacing-5: 1.25rem;
        --spacing-6: 1.5rem;
        --spacing-8: 2rem;
        --spacing-10: 2.5rem;
        --spacing-12: 3rem;
        --spacing-16: 4rem;
        
        /* Shadows for dark theme */
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -1px rgba(0, 0, 0, 0.3);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
        --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
        
        /* Border Radius */
        --radius-sm: 0.375rem;
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --radius-xl: 1rem;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-family);
        background-color: var(--bg-primary);
        color: var(--text-primary);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 100vh;
      }

      .container {
        max-width: 428px;
        margin: 0 auto;
        padding: var(--spacing-4);
        min-height: 100vh;
      }

      /* Header Styles */
      .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding-bottom: var(--spacing-8);
        border-bottom: 1px solid var(--border-primary);
        margin-bottom: var(--spacing-8);
      }

      .user-greeting h1 {
        font-size: var(--font-size-2xl);
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: var(--spacing-1);
      }

      .last-updated {
        font-size: var(--font-size-sm);
        color: var(--text-muted);
      }

      .notification-icon {
        position: relative;
        font-size: var(--font-size-xl);
        cursor: pointer;
        transition: transform 0.2s ease;
        color: var(--text-secondary);
      }

      .notification-icon:hover {
        transform: scale(1.1);
        color: var(--accent-cyan);
      }

      .notification-dot {
        position: absolute;
        top: -2px;
        right: -2px;
        width: 8px;
        height: 8px;
        background-color: var(--accent-pink);
        border-radius: 50%;
        animation: pulse 2s infinite;
        box-shadow: 0 0 8px var(--accent-pink);
      }

      @keyframes pulse {
        0%, 100% { 
          opacity: 1; 
          transform: scale(1);
        }
        50% { 
          opacity: 0.7;
          transform: scale(1.1);
        }
      }

      /* Card Styles */
      .card {
        background: var(--bg-card);
        border: 1px solid var(--border-primary);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
        overflow: hidden;
        transition: all 0.3s ease;
      }

      .card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-lg);
        background: var(--bg-card-hover);
        border-color: var(--border-secondary);
      }

      .card-header {
        padding: var(--spacing-5) var(--spacing-6) var(--spacing-2);
      }

      .card-title {
        font-size: var(--font-size-base);
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: var(--spacing-1);
      }

      .card-subtitle {
        font-size: var(--font-size-xs);
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .card-content {
        padding: 0 var(--spacing-6) var(--spacing-6);
      }

      /* Balance Section */
      .balance-section {
        margin-bottom: var(--spacing-8);
      }

      .primary-card {
        background: linear-gradient(135deg, var(--primary-600) 0%, var(--primary-700) 100%);
        color: white;
        border: 1px solid var(--primary-500);
        box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
      }

      .primary-card .card-title,
      .primary-card .card-subtitle {
        color: rgba(255, 255, 255, 0.9);
      }

      .balance-amount {
        font-size: var(--font-size-4xl);
        font-weight: 700;
        line-height: 1.1;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      }

      /* Metrics Grid */
      .metrics-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--spacing-4);
        margin-bottom: var(--spacing-8);
      }

      .rate-card {
        background: linear-gradient(135deg, var(--accent-purple) 0%, #7c3aed 100%);
        color: white;
        border: 1px solid var(--accent-purple);
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
      }

      .rate-card .card-title,
      .rate-card .card-subtitle {
        color: rgba(255, 255, 255, 0.9);
      }

      .earned-card {
        background: linear-gradient(135deg, var(--accent-green) 0%, #16a34a 100%);
        color: white;
        border: 1px solid var(--accent-green);
        box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
      }

      .earned-card .card-title,
      .earned-card .card-subtitle {
        color: rgba(255, 255, 255, 0.9);
      }

      .rate-display,
      .earned-amount {
        font-size: var(--font-size-2xl);
        font-weight: 700;
        line-height: 1.1;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
      }

      /* Interest Section */
      .interest-section {
        margin-bottom: var(--spacing-8);
      }

      .section-title {
        font-size: var(--font-size-lg);
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: var(--spacing-6);
      }

      .interest-grid {
        display: grid;
        gap: var(--spacing-4);
      }

      .interest-amount {
        font-size: var(--font-size-xl);
        font-weight: 700;
        margin-bottom: var(--spacing-2);
      }

      .interest-amount.accumulated {
        color: var(--accent-green);
        text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
      }

      .interest-amount.pending {
        color: var(--accent-cyan);
        text-shadow: 0 0 10px rgba(34, 211, 238, 0.5);
      }

      .interest-growth {
        font-size: var(--font-size-sm);
        color: var(--accent-green);
        font-weight: 500;
      }

      .interest-note {
        font-size: var(--font-size-sm);
        color: var(--text-muted);
      }

      /* Quick Actions */
      .quick-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--spacing-4);
        margin-top: var(--spacing-8);
      }

      .action-btn {
        padding: var(--spacing-4) var(--spacing-6);
        border: none;
        border-radius: var(--radius-md);
        font-size: var(--font-size-base);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: center;
        position: relative;
        overflow: hidden;
      }

      .action-btn.primary {
        background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--primary-600) 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(34, 211, 238, 0.3);
      }

      .action-btn.primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(34, 211, 238, 0.4);
      }

      .action-btn.secondary {
        background-color: var(--bg-tertiary);
        color: var(--text-primary);
        border: 1px solid var(--border-secondary);
      }

      .action-btn.secondary:hover {
        background-color: var(--border-secondary);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }

      .action-btn:active {
        transform: scale(0.98);
      }

      /* Responsive Design */
      @media (max-width: 375px) {
        .container {
          padding: var(--spacing-3);
        }
        
        .user-greeting h1 {
          font-size: var(--font-size-xl);
        }
        
        .balance-amount {
          font-size: var(--font-size-3xl);
        }
        
        .metrics-grid {
          grid-template-columns: 1fr;
        }
        
        .quick-actions {
          grid-template-columns: 1fr;
        }
      }

      @media (min-width: 429px) {
        .container {
          max-width: 100%;
          padding: var(--spacing-6);
        }
        
        .interest-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* Loading Animation */
      @keyframes shimmer {
        0% {
          background-position: -200px 0;
        }
        100% {
          background-position: calc(200px + 100%) 0;
        }
      }

      /* Accessibility */
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Focus states */
      .action-btn:focus,
      .notification-icon:focus {
        outline: 2px solid var(--accent-cyan);
        outline-offset: 2px;
      }

      /* Glow effects for dark theme */
      .card:hover {
        box-shadow: var(--shadow-lg), 0 0 20px rgba(34, 211, 238, 0.1);
      }

      /* Custom scrollbar for dark theme */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: var(--bg-secondary);
      }

      ::-webkit-scrollbar-thumb {
        background: var(--border-secondary);
        border-radius: var(--radius-sm);
      }

      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    
    <script>
      // Mock data for the interest app
      const userData = {
        accountTotal: 25847.32,
        interestAccumulated: 1247.85,
        interestPending: 87.43,
        annualRate: 4.2,
        earnedThisMonth: 298.67,
        earnedThisYear: 1247.85,
        lastUpdated: new Date().toLocaleString()
      }

      function formatCurrency(amount) {
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          minimumFractionDigits: 2
        }).format(amount)
      }

      function formatPercentage(rate) {
        return `${rate.toFixed(2)}%`
      }

      function createCard(title, content, subtitle = '', className = '') {
        return `
          <div class="card ${className}">
            <div class="card-header">
              <h3 class="card-title">${title}</h3>
              ${subtitle ? `<span class="card-subtitle">${subtitle}</span>` : ''}
            </div>
            <div class="card-content">
              ${content}
            </div>
          </div>
        `
      }

      function renderApp() {
        const app = document.querySelector('#app')
        
        app.innerHTML = `
          <div class="container">
            <header class="header">
              <div class="user-greeting">
                <h1>Welcome back, John</h1>
                <p class="last-updated">Last updated: ${userData.lastUpdated}</p>
              </div>
              <div class="notification-icon">
                <span class="notification-dot"></span>
                🔔
              </div>
            </header>

            <main class="main-content">
              <div class="balance-section">
                ${createCard(
                  'Account Total',
                  `<div class="balance-amount">${formatCurrency(userData.accountTotal)}</div>`,
                  'Your current balance',
                  'primary-card'
                )}
              </div>

              <div class="metrics-grid">
                ${createCard(
                  'Optimize Annual Rate',
                  `<div class="rate-display">estimates 2% - 4%</div>`,
                  'Projected returns',
                  'rate-card'
                )}
                
                ${createCard(
                  'Earned',
                  `<div class="earned-amount">${formatCurrency(userData.earnedThisMonth)}</div>`,
                  'This month',
                  'earned-card'
                )}
              </div>

              <div class="interest-section">
                <h2 class="section-title">Interest Overview</h2>
                
                <div class="interest-grid">
                  ${createCard(
                    'Accumulated',
                    `<div class="interest-amount accumulated">${formatCurrency(userData.interestAccumulated)}</div>
                     <div class="interest-growth">+${formatCurrency(userData.earnedThisYear)} this year</div>`,
                    'Total earned to date'
                  )}
                  
                  ${createCard(
                    'Pending this week',
                    `<div class="interest-amount pending">${formatCurrency(userData.interestPending)}</div>
                     <div class="interest-note">Next payout in 3 days</div>`,
                    'Weekly accrual'
                  )}
                </div>
              </div>

              <div class="quick-actions">
                <button class="action-btn primary">View Details</button>
                <button class="action-btn secondary">Add Funds</button>
              </div>
            </main>
          </div>
        `

        // Add click handlers for interactive elements
        document.querySelectorAll('.action-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.target.style.transform = 'scale(0.95)'
            setTimeout(() => {
              e.target.style.transform = 'scale(1)'
            }, 150)
          })
        })

        // Add pulse animation to notification dot
        const notificationDot = document.querySelector('.notification-dot')
        if (notificationDot) {
          setInterval(() => {
            notificationDot.style.animation = 'none'
            setTimeout(() => {
              notificationDot.style.animation = 'pulse 2s infinite'
            }, 10)
          }, 5000)
        }
      }

      // Initialize the app
      renderApp()

      // Simulate real-time updates
      setInterval(() => {
        userData.interestPending += 0.01
        userData.lastUpdated = new Date().toLocaleString()
        
        const pendingElement = document.querySelector('.interest-amount.pending')
        if (pendingElement) {
          pendingElement.textContent = formatCurrency(userData.interestPending)
        }
      }, 30000) // Update every 30 seconds
    </script>
  </body>
</html>
